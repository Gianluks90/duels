<div class="background-picker">
  <select
    class="background-picker__select"
    [attr.aria-label]="'profile.background.title' | translate"
    (change)="onSelectChange($event)"
  >
    @for (option of options(); track option.id) {
      <option [value]="option.id" [selected]="option.id === selectedId()">
        {{ optionLabelKey(option.id) | translate }}
      </option>
    }
  </select>

  @if (selectedOption(); as option) {
    <div class="background-picker__preview">
      <img [src]="option.file" alt="" />
    </div>
  }

  <button
    type="button"
    class="btn btn--primary background-picker__apply"
    [disabled]="!isDirty()"
    (click)="apply()"
  >
    {{ 'profile.background.apply' | translate }}
  </button>
</div>
