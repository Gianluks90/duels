<div class="card-back-picker">
  <div class="card-back-picker__grid">
    @for (skin of ownedCardBacks(); track skin) {
      <button
        type="button"
        class="card-back-picker__skin"
        [class.card-back-picker__skin--active]="selectedSkin() === skin"
        [attr.aria-pressed]="selectedSkin() === skin"
        (click)="select(skin)"
      >
        <img [src]="'/cards-back/' + skin + '.webp'" alt="" />
      </button>
    }
  </div>

  <button
    type="button"
    class="btn btn--primary card-back-picker__apply"
    [disabled]="!isDirty()"
    (click)="apply()"
  >
    {{ 'profile.cardBack.apply' | translate }}
  </button>
</div>
