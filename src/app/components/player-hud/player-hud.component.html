<div class="hud" [class.hud--mirrored]="mirrored()" [class.hud--frozen]="frozen()" [style.width.px]="width()">

  <!-- Congelamento (2.3.1): texture di ghiaccio in overlay sull'intero box, con un velo azzurro
       (la texture di per sé è quasi bianca). Puramente decorativo — lo stato viene comunicato a
       chi non vede a schermo dallo span sr-only qui sotto, non dal solo overlay visivo. -->
  @if (frozen()) {
    <div class="hud__frozen-overlay" aria-hidden="true"></div>
    <span class="hud__sr-only">{{ frozenAria() }}</span>
  }

  <!-- Only this wrapper (sized to the visible slice) is space-between'd —
       the outer .hud stays anchored to the edge like the other two panels. -->
  <div class="hud__content">

    <!-- Name (+ settings, only on our own panel) -->
    <div class="hud__name-row">
      <span class="hud__name t-heading">{{ firstName() }}</span>
      @if (!mirrored()) {
        <button type="button" class="hud__settings" (click)="settingsClick.emit()" [attr.aria-label]="'playerHud.settingsAria' | translate">
          <span class="hud__settings-icon" aria-hidden="true"></span>
        </button>
      }
    </div>

    <!-- HP bar: pill-shaped track with a glossy red fill (current/max) plus a
         blue shield segment right after it (bonus effective hp); mana + hp
         values protrude above it, side by side on the same baseline -->
    <div class="hud__hp-bar" [attr.aria-label]="hpAria()">
      <div class="hud__hp-track">
        <div class="hud__hp-fill" [class.hud__hp-fill--poisoned]="isPoisoned()" [style.width.%]="hpPercent()" aria-hidden="true"></div>
        @if (hasShield()) {
          <div class="hud__hp-shield-fill" [style.width.%]="shieldPercent()"
               [style.left.%]="mirrored() ? null : hpPercent()" [style.right.%]="mirrored() ? hpPercent() : null"
               aria-hidden="true"></div>
        }
      </div>
      <div class="hud__values">
        @if (isPoisoned()) {
          <span class="hud__poison" [attr.aria-label]="poisonAria()">
            @for (level of poisonRange(); track level) {
              <span class="hud__poison-skull" aria-hidden="true">
                <img class="hud__poison-skull-icon" [src]="poisonIcon" alt="" />
              </span>
            }
          </span>
        }
        @if (hpTooltip(); as tip) {
          <span class="hud__hp-value hud__hp-value--interactive" tabindex="0" [appTooltip]="tip" [tooltipPosition]="mirrored() ? 'bottom' : 'top'">{{ displayedHp() }}</span>
        } @else {
          <span class="hud__hp-value">{{ displayedHp() }}</span>
        }
      </div>
    </div>

  </div>

</div>
