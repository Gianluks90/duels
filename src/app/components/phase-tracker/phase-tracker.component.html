<div class="tracker">
  <p class="tracker__turn">{{ turnLabel() }}</p>

  <div class="tracker__steps" role="list" [attr.aria-label]="'phaseTracker.stepsAria' | translate">
    <div class="tracker__line" aria-hidden="true"></div>
    @for (p of phases; track p) {
      <div class="tracker__step" role="listitem" tabindex="0"
           [class.tracker__step--done]="stepState(p) === 'done'"
           [class.tracker__step--active]="stepState(p) === 'active'"
           [attr.aria-current]="stepState(p) === 'active' ? 'step' : null"
           [appTooltip]="i18n.turnPhaseDescription(p)" tooltipPosition="top">
        <span class="tracker__step-dot" aria-hidden="true"></span>
        <div class="tracker__step-label-wrap">
          <span class="tracker__step-label">{{ i18n.turnPhaseLabel(p) }}</span>
          @if (p === 'incantesimo' && pendingSpellsCount() > 0) {
            <div class="tracker__pending-spells" [attr.aria-label]="'phaseTracker.pendingSpellsAria' | translate:{ count: pendingSpellsCount() }">
              @for (i of pendingSpellsRange(); track i) {
                <span class="tracker__pending-spell-dot" aria-hidden="true"></span>
              }
            </div>
          }
        </div>
      </div>
    }
  </div>

  <button type="button" class="btn btn--primary tracker__advance" [disabled]="!canAdvance()" (click)="advance.emit()">
    {{ 'board.turn.advance' | translate }}
  </button>
</div>
