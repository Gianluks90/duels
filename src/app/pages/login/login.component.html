<div class="login">
  <div class="login__panel panel panel--raised">
    <h1 class="t-display login__title">Duels</h1>
    <p class="t-muted login__subtitle">{{ 'login.subtitle' | translate }}</p>

    <button
      class="btn btn--primary login__btn"
      [disabled]="loading()"
      (click)="signIn()"
    >
      {{ (loading() ? 'login.signingIn' : 'login.signIn') | translate }}
    </button>

    @if (error()) {
      <p class="login__error">{{ error() }}</p>
    }
  </div>
</div>
