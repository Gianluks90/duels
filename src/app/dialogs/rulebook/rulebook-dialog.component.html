<div class="rulebook-dialog">
  <header class="rulebook-dialog__header">
    <h2 class="t-heading rulebook-dialog__title">{{ 'rulebook.title' | translate }}</h2>
    <app-icon-button [icon]="closeIcon" [ariaLabel]="'rulebook.closeAria' | translate" [size]="32" (iconClick)="close()" />
  </header>

  <div class="rulebook-dialog__body">
    <nav class="rulebook-dialog__nav" [attr.aria-label]="'rulebook.navAria' | translate">
      @for (section of sections(); track section.id) {
        <button
          class="rulebook-dialog__nav-item"
          [class.rulebook-dialog__nav-item--active]="activeId() === section.id"
          (click)="selectSection(section.id)"
        >
          {{ section.title }}
        </button>
      }
    </nav>

    <div class="rulebook-dialog__content">
      @if (loading()) {
        <div class="rulebook-dialog__loader">
          <span class="rulebook-dialog__dot"></span>
          <span class="rulebook-dialog__dot"></span>
          <span class="rulebook-dialog__dot"></span>
        </div>
      } @else {
        <div class="prose" [innerHTML]="renderedContent()"></div>
      }
    </div>
  </div>
</div>
