<div
  class="emote-picker-dialog"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'emotePicker.dialogAria' | translate"
>
  <header class="emote-picker-dialog__header">
    <h2 class="t-heading emote-picker-dialog__title">{{ 'emotePicker.title' | translate }}</h2>
    <app-icon-button
      [icon]="closeIcon"
      [ariaLabel]="'emotePicker.closeAria' | translate"
      [size]="32"
      (iconClick)="close()"
    />
  </header>

  <ul class="emote-picker-dialog__list">
    @for (option of options; track option.emoteId) {
      <li>
        <button type="button" class="emote-picker-dialog__option" (click)="pick(option.emoteId)">
          <span class="emote-picker-dialog__category">{{
            'collection.emoteCategories.' + option.category | translate
          }}</span>
          <span class="emote-picker-dialog__text">{{ option.text }}</span>
        </button>
      </li>
    }
  </ul>
</div>
